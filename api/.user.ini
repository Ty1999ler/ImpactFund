; PHP upload limits for the application form (GoDaddy shared hosting reads
; .user.ini for CGI/FastCGI PHP; takes effect within ~5 minutes of upload).
; Keep in sync with max_file_mb in api/config.php and js/apply-form.js.
; max_file_uploads: the project completion page (api/completion.php) takes up
; to 19 files in one request (1 report + 10 receipts + 8 photos), and PHP drops
; anything past this count without a word, so keep it above 19. Their total
; size is capped at 50 MB by the page and the endpoint, inside post_max_size.
upload_max_filesize = 12M
post_max_size = 60M
max_file_uploads = 20
