name: Forms smoke test

# End-to-end smoke test of the PHP form backend: builds the Dockerfile.php
# image, runs it with the committable CI config (api/config.ci.php) mounted
# over api/config.php, and exercises /api/contact.php and /api/apply.php
# with plain curl + bash assertions.

on:
  push:
    paths:
      - 'api/**'
      - 'Dockerfile.php'
      - '.dockerignore'
      - 'ci/**'
      - 'js/winners-schools-fall-2026.js'   # api/winners.php reads it (school_listed)
      - '.github/workflows/forms-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build the PHP site image
        run: docker build -f Dockerfile.php -t site .

      - name: Run the container (CI config + fake sendmail mounted)
        run: |
          set -euo pipefail
          # MAIL STRATEGY: contact.php delivers via PHP mail(), which pipes
          # the message to sendmail_path ("/usr/sbin/sendmail -t -i"; the
          # image installs msmtp-mta). Without an /etc/msmtprc msmtp exits
          # non-zero, mail() returns false, and contact.php answers 500. So
          # we bind-mount ci/fake-sendmail.sh over /usr/sbin/sendmail: it
          # swallows stdin into /tmp/mail.out and exits 0. mail()'s return
          # value is simply the sendmail exit status, so it reports success,
          # contact.php returns 200, and we can docker-exec the captured
          # message back out to assert the recipient and body made it.
          # (/usr/sbin/sendmail is a symlink to msmtp; the runtime resolves
          # the mount destination, so invoking /usr/sbin/sendmail still
          # executes our script either way.)
          #
          # CONFIG MOUNT: Dockerfile.php rm's api/config.php from the image,
          # but a single-file bind mount creates the missing destination
          # path, so mounting config.ci.php over it works.
          sed -i 's/\r$//' ci/fake-sendmail.sh ci/mail-subjects.sh   # guard against a CRLF checkout breaking the shebang
          chmod +x ci/fake-sendmail.sh           # exec bit may not survive a Windows-side commit
          docker run -d --name site -p 8777:8777 \
            -v "$PWD/api/config.ci.php:/var/www/html/api/config.php:ro" \
            -v "$PWD/ci/fake-sendmail.sh:/usr/sbin/sendmail:ro" \
            site

      - name: Wait for the server
        run: |
          set -euo pipefail
          # --retry-all-errors: docker-proxy accepts the connection before
          # Apache is up and then resets it (curl exit 52/56), which plain
          # --retry/--retry-connrefused would NOT retry.
          curl -fsS -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused \
            --retry-all-errors http://localhost:8777/

      - name: Contact — valid submission returns 200 and mail is captured
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -d name='Smoke Test' \
            -d email='smoke@example.com' \
            -d message='Smoke test message from CI' \
            http://localhost:8777/api/contact.php)
          cat /tmp/body.json; echo
          test "$status" = "200"
          test "$(jq -r .ok /tmp/body.json)" = "true"
          # The fake sendmail captured the raw message inside the container.
          docker exec site cat /tmp/mail.out > /tmp/mail.captured
          grep -q 'contact-ci@example.invalid' /tmp/mail.captured   # To: header = config contact_to
          grep -q 'Smoke test message from CI' /tmp/mail.captured   # body made it through
          # localhost is not a test host: no [TEST] in the subject.
          test "$(sh ci/mail-subjects.sh /tmp/mail.captured)" = "Contact form — Smoke Test"

      - name: Contact — bad email returns 422 with fields.email
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -d name='Smoke Test' \
            -d email='not-an-email' \
            -d message='hello' \
            http://localhost:8777/api/contact.php)
          cat /tmp/body.json; echo
          test "$status" = "422"
          test "$(jq -r .ok /tmp/body.json)" = "false"
          test "$(jq -r '.fields.email' /tmp/body.json)" = "Invalid email"

      # ---- [TEST] marking (Oct 2026): a form sent from a test copy of the
      # site (staging and its preview copies, the NAS — SITE_TEST_HOSTS in
      # api/_lib.php) gets "[TEST] " in front of every email subject and
      # "test": true in submission.json; production and localhost stay
      # unmarked. curl -H 'Host: …' stands in for the host name the browser
      # would send; config.ci.php has no test_mode key, so it is automatic.
      - name: Contact — test hosts get [TEST] in the subject, production names don't
        run: |
          set -euo pipefail
          for pair in 'staging.alumoimpact.ca:[TEST] ' 'www.before.alumoimpact.ca:[TEST] ' \
                      'impactfund.wareham.stream:[TEST] ' 'alumoimpact.ca:' 'www.alumoimpact.ca:'; do
            host=${pair%%:*}; prefix=${pair#*:}
            status=$(curl -sS -o /tmp/body.json -w '%{http_code}' -H "Host: $host" \
              -d name='Host Test' \
              -d email='host-test@example.com' \
              -d message="Sent as $host" \
              http://localhost:8777/api/contact.php)
            test "$status" = "200"
            docker exec site cat /tmp/mail.out > /tmp/mail.captured
            grep -q "Sent as $host" /tmp/mail.captured             # this request's message
            subject=$(sh ci/mail-subjects.sh /tmp/mail.captured)
            echo "$host -> $subject"
            test "$subject" = "${prefix}Contact form — Host Test"
          done

      - name: Contact — test_mode true marks any host but production's names
        run: |
          set -euo pipefail
          # Its own container (own rate-limit store) with 'test_mode' => true
          # added by sed: a staging config copied to production must not mark
          # real submissions, so alumoimpact.ca / www. stay plain even then.
          sed "s/'delivery_mode' => 'off',/&\n    'test_mode' => true,/" api/config.ci.php > /tmp/config.forced.php
          grep -q "'test_mode' => true," /tmp/config.forced.php
          docker run -d --name site-forced -p 8783:8777 \
            -v /tmp/config.forced.php:/var/www/html/api/config.php:ro \
            -v "$PWD/ci/fake-sendmail.sh:/usr/sbin/sendmail:ro" site
          curl -fsS -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused \
            --retry-all-errors http://localhost:8783/
          for pair in 'localhost:8783|[TEST] ' '192.0.2.10:8777|[TEST] ' \
                      'alumoimpact.ca|' 'www.alumoimpact.ca:443|'; do
            host=${pair%%|*}; prefix=${pair#*|}
            status=$(curl -sS -o /tmp/body.json -w '%{http_code}' -H "Host: $host" \
              -d name='Forced Test' \
              -d email='forced-test@example.com' \
              -d message="Sent as $host" \
              http://localhost:8783/api/contact.php)
            test "$status" = "200"
            docker exec site-forced cat /tmp/mail.out > /tmp/mail.captured
            grep -q "Sent as $host" /tmp/mail.captured
            subject=$(sh ci/mail-subjects.sh /tmp/mail.captured)
            echo "$host -> $subject"
            test "$subject" = "${prefix}Contact form — Forced Test"
          done

      - name: Create upload fixtures
        run: |
          set -euo pipefail
          mkdir -p /tmp/fixtures
          for f in project-overview budget team-members action-plan support-letter; do
            printf '%s\n%s\n' '%PDF-1.4' '%%EOF' > "/tmp/fixtures/$f.pdf"
          done
          # 11 MB file for the oversize test (per-file cap is 10 MB)
          { printf '%s\n' '%PDF-1.4'; head -c 11534336 /dev/zero; } > /tmp/fixtures/too-big.pdf

      - name: Apply — full valid submission returns 200 and is archived
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -F primary_first_name='Ada' \
            -F primary_last_name='Lovelace' \
            -F primary_email='ada@example.com' \
            -F primary_role='President' \
            -F organization_name='CI Test Org' \
            -F province='ON' \
            -F institution='Test University' \
            -F project_title='CI Smoke Project' \
            -F category='Sustainability' \
            -F funding_requested='1000' \
            -F total_cost='1500' \
            -F fund_acknowledgement='yes' \
            -F project_summary='A smoke-test submission from CI.' \
            -F students_in_org='12' \
            -F students_reached='300' \
            -F consent='yes' \
            -F file_project_overview=@/tmp/fixtures/project-overview.pdf \
            -F file_budget=@/tmp/fixtures/budget.pdf \
            -F file_team_members=@/tmp/fixtures/team-members.pdf \
            -F file_action_plan=@/tmp/fixtures/action-plan.pdf \
            -F file_support_letter=@/tmp/fixtures/support-letter.pdf \
            http://localhost:8777/api/apply.php)
          cat /tmp/body.json; echo
          test "$status" = "200"
          test "$(jq -r .ok /tmp/body.json)" = "true"
          id=$(jq -r .id /tmp/body.json)
          echo "$id" | grep -Eq '^[0-9]{8}-[0-9]{6}-[0-9a-f]{8}$'
          # Archived on disk: submission.json + 5 uploads named <slot>--<original>
          docker exec site test -f "/var/www/_submissions/$id/submission.json"
          for f in 'file_project_overview--project-overview.pdf' 'file_budget--budget.pdf' \
                   'file_team_members--team-members.pdf' 'file_action_plan--action-plan.pdf' \
                   'file_support_letter--support-letter.pdf'; do
            docker exec site test -f "/var/www/_submissions/$id/$f"
          done
          docker exec site cat "/var/www/_submissions/$id/submission.json" > /tmp/submission.json
          test "$(jq -r .fields.project_title /tmp/submission.json)" = "CI Smoke Project"
          test "$(jq -r '.files | length' /tmp/submission.json)" = "5"
          # Sent to localhost: not a test submission, and the acknowledgement
          # has no [TEST]. It goes out AFTER the response (respond_and_continue),
          # so wait for it to reach the fake sendmail.
          test "$(jq -r .test /tmp/submission.json)" = "false"
          for i in $(seq 1 30); do
            docker exec site cat /tmp/mail.out > /tmp/mail.captured 2>/dev/null || true
            grep -q '^To: ada@example.com' /tmp/mail.captured && break
            sleep 0.5
          done
          test "$(sh ci/mail-subjects.sh /tmp/mail.captured)" = "We received your application — Student Impact Fund"

      - name: Apply — sent as staging, the submission is marked test and the acknowledgement says [TEST]
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' -H 'Host: staging.alumoimpact.ca' \
            -F primary_first_name='Test' \
            -F primary_last_name='Staging' \
            -F primary_email='staging-test@example.com' \
            -F primary_role='President' \
            -F organization_name='CI Test Org' \
            -F province='ON' \
            -F institution='Test University' \
            -F project_title='CI Staging Project' \
            -F category='Sustainability' \
            -F funding_requested='1000' \
            -F total_cost='1500' \
            -F fund_acknowledgement='yes' \
            -F project_summary='A smoke-test submission sent as staging.' \
            -F students_in_org='12' \
            -F students_reached='300' \
            -F consent='yes' \
            -F file_project_overview=@/tmp/fixtures/project-overview.pdf \
            -F file_budget=@/tmp/fixtures/budget.pdf \
            -F file_team_members=@/tmp/fixtures/team-members.pdf \
            -F file_action_plan=@/tmp/fixtures/action-plan.pdf \
            -F file_support_letter=@/tmp/fixtures/support-letter.pdf \
            http://localhost:8777/api/apply.php)
          cat /tmp/body.json; echo
          test "$status" = "200"
          id=$(jq -r .id /tmp/body.json)
          docker exec site cat "/var/www/_submissions/$id/submission.json" > /tmp/submission.json
          test "$(jq -r .test /tmp/submission.json)" = "true"
          test "$(jq -r .fields.project_title /tmp/submission.json)" = "CI Staging Project"   # the archive keeps the real title
          for i in $(seq 1 30); do
            docker exec site cat /tmp/mail.out > /tmp/mail.captured 2>/dev/null || true
            grep -q '^To: staging-test@example.com' /tmp/mail.captured && break
            sleep 0.5
          done
          subject=$(sh ci/mail-subjects.sh /tmp/mail.captured)
          echo "acknowledgement: $subject"
          test "$subject" = "[TEST] We received your application — Student Impact Fund"

      - name: Apply — honeypot pretends success but archives nothing
        run: |
          set -euo pipefail
          before=$(docker exec site sh -c 'find /var/www/_submissions -mindepth 1 -maxdepth 1 -type d | wc -l')
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -F website='https://spam.example.com' \
            -F primary_first_name='Bot' \
            http://localhost:8777/api/apply.php)
          cat /tmp/body.json; echo
          test "$status" = "200"
          test "$(jq -r .ok /tmp/body.json)" = "true"
          test "$(jq -r .id /tmp/body.json)" = "null"   # no id — nothing was stored
          after=$(docker exec site sh -c 'find /var/www/_submissions -mindepth 1 -maxdepth 1 -type d | wc -l')
          test "$before" = "$after"

      - name: Apply — 11 MB file is rejected
        run: |
          set -euo pipefail
          # The image's PHP limits (upload_max_filesize 12M, post_max_size 60M)
          # are ABOVE the 11 MB payload, so the upload reaches apply.php and
          # its own max_file_mb=10 check answers 422 with a per-field error.
          # We also accept 413 — apply.php's answer when post_max_size trips
          # first and PHP hands it an empty request — in case the image limits
          # are ever lowered. Other fields are deliberately omitted: their
          # "Required" errors ride along in the same 422, and the assertion
          # targets the size error on file_budget specifically.
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -F file_budget=@/tmp/fixtures/too-big.pdf \
            http://localhost:8777/api/apply.php)
          cat /tmp/body.json; echo
          case "$status" in
            422) jq -e '.fields.file_budget | test("larger")' /tmp/body.json > /dev/null ;;
            413) ;;  # post limit tripped first — also a correct rejection
            *)   echo "unexpected status: $status"; exit 1 ;;
          esac

      - name: Apply — email relay sent as a test host says [TEST] on both emails, as production on neither
        run: |
          set -euo pipefail
          # Its own container with delivery_mode 'email', so the team relay is
          # sent too (to relay_to, with the five attachments). The fake
          # sendmail keeps every message in /tmp/mail.all.
          sed "s/'delivery_mode' => 'off'/'delivery_mode' => 'email'/" api/config.ci.php > /tmp/config.email.php
          grep -q "'delivery_mode' => 'email'" /tmp/config.email.php
          docker run -d --name site-email -p 8782:8777 \
            -v /tmp/config.email.php:/var/www/html/api/config.php:ro \
            -v "$PWD/ci/fake-sendmail.sh:/usr/sbin/sendmail:ro" site
          curl -fsS -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused \
            --retry-all-errors http://localhost:8782/
          # $1 = Host header ('' = curl's own, localhost:8782), $2 = project title
          apply() {
            hdr=()
            if [ -n "$1" ]; then hdr=(-H "Host: $1"); fi
            curl -sS -o /tmp/body.json -w '%{http_code}' "${hdr[@]}" \
              -F primary_first_name='Relay' -F primary_last_name='Test' \
              -F primary_email='relay-test@example.com' -F primary_role='President' \
              -F province='ON' -F institution='Test University' \
              -F project_title="$2" -F category='Sustainability' \
              -F funding_requested='1000' -F total_cost='1500' \
              -F fund_acknowledgement='yes' -F project_summary='Relay smoke test.' \
              -F students_in_org='12' -F students_reached='300' -F consent='yes' \
              -F file_project_overview=@/tmp/fixtures/project-overview.pdf \
              -F file_budget=@/tmp/fixtures/budget.pdf \
              -F file_team_members=@/tmp/fixtures/team-members.pdf \
              -F file_action_plan=@/tmp/fixtures/action-plan.pdf \
              -F file_support_letter=@/tmp/fixtures/support-letter.pdf \
              http://localhost:8782/api/apply.php
          }
          # Both emails go out after the response, so wait for each pair
          # before the next request (two senders at once would interleave).
          wait_for() {
            for i in $(seq 1 30); do
              docker exec site-email sh -c 'cat /tmp/mail.all 2>/dev/null' > /tmp/mail.all || true
              [ "$(grep -c '^Subject: ' /tmp/mail.all || true)" -ge "$1" ] && return 0
              sleep 0.5
            done
            echo "expected $1 messages"; return 1
          }
          test "$(apply open.alumoimpact.ca 'CI Relay Test Host')" = "200"
          id=$(jq -r .id /tmp/body.json)
          wait_for 2
          test "$(apply '' 'CI Relay Production')" = "200"
          wait_for 4
          sh ci/mail-subjects.sh /tmp/mail.all > /tmp/subjects.txt
          cat /tmp/subjects.txt
          test "$(sed -n 1p /tmp/subjects.txt)" = "[TEST] Application — CI Relay Test Host ($id)"
          test "$(sed -n 2p /tmp/subjects.txt)" = "[TEST] We received your application — Student Impact Fund"
          sed -n 3p /tmp/subjects.txt | grep -Eq '^Application — CI Relay Production \([0-9]{8}-[0-9]{6}-[0-9a-f]{8}\)$'
          test "$(sed -n 4p /tmp/subjects.txt)" = "We received your application — Student Impact Fund"
          test "$(wc -l < /tmp/subjects.txt)" = "4"
          docker exec site-email cat "/var/www/_submissions/$id/submission.json" > /tmp/submission.json
          test "$(jq -r .test /tmp/submission.json)" = "true"
          test "$(jq -r .delivery.status /tmp/submission.json)" = "delivered"

      # ---- Schedule gates (Oct 2026). Each case runs its own container from
      # the same image, with a copy of config.ci.php whose closes_at line is
      # rewritten by sed (grep -q proves each sed really matched). Separate
      # containers also mean separate rate-limit stores.
      - name: Apply — after closes_at + grace the endpoint answers 403 (preview params ignored, nothing stored)
        run: |
          set -euo pipefail
          sed "s/'closes_at' => ''/'closes_at' => '2020-01-01T00:00:00-05:00'/" api/config.ci.php > /tmp/config.closed.php
          grep -q "'closes_at' => '2020-01-01T00:00:00-05:00'" /tmp/config.closed.php
          docker run -d --name site-closed -p 8778:8777 \
            -v /tmp/config.closed.php:/var/www/html/api/config.php:ro site
          curl -fsS -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused \
            --retry-all-errors http://localhost:8778/
          # A COMPLETE, valid submission — it would be accepted (200) and
          # archived if the gate let it through. The page-preview parameters
          # on the URL claim a moment inside the window; the server must not
          # care (it never reads the query string).
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -F primary_first_name='Late' \
            -F primary_last_name='Applicant' \
            -F primary_email='late@example.com' \
            -F primary_role='President' \
            -F organization_name='CI Test Org' \
            -F province='ON' \
            -F institution='Test University' \
            -F project_title='CI Late Project' \
            -F category='Sustainability' \
            -F funding_requested='1000' \
            -F total_cost='1500' \
            -F fund_acknowledgement='yes' \
            -F project_summary='Sent after the close.' \
            -F students_in_org='12' \
            -F students_reached='300' \
            -F consent='yes' \
            -F file_project_overview=@/tmp/fixtures/project-overview.pdf \
            -F file_budget=@/tmp/fixtures/budget.pdf \
            -F file_team_members=@/tmp/fixtures/team-members.pdf \
            -F file_action_plan=@/tmp/fixtures/action-plan.pdf \
            -F file_support_letter=@/tmp/fixtures/support-letter.pdf \
            'http://localhost:8778/api/apply.php?preview-form=1&preview-at=2019-06-01T12:00:00Z')
          cat /tmp/body.json; echo
          test "$status" = "403"
          test "$(jq -r .error /tmp/body.json)" = "Submissions are now closed."
          test "$(docker exec site-closed sh -c 'find /var/www/_submissions -mindepth 1 -maxdepth 1 | wc -l')" = "0"

      - name: Apply — inside the grace window the gate stays open (422)
        run: |
          set -euo pipefail
          past=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          sed "s/'closes_at' => ''/'closes_at' => '$past'/" api/config.ci.php > /tmp/config.grace.php
          grep -q "'closes_at' => '$past'" /tmp/config.grace.php
          # The window this case relies on: the TOP-LEVEL key (4-space indent),
          # not the winners block's own close_grace_minutes.
          grep -q "^    'close_grace_minutes' => 15," /tmp/config.grace.php
          docker run -d --name site-grace -p 8779:8777 \
            -v /tmp/config.grace.php:/var/www/html/api/config.php:ro site
          curl -fsS -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused \
            --retry-all-errors http://localhost:8779/
          # Fields omitted on purpose: a 422 proves the request got PAST the
          # gate (closed 5 minutes ago, 15 minutes' grace) and stores nothing.
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' -F primary_first_name='In flight' \
            http://localhost:8779/api/apply.php)
          cat /tmp/body.json; echo
          test "$status" = "422"

      - name: Apply — a closes_at that does not parse fails CLOSED (403, logged)
        run: |
          set -euo pipefail
          sed "s/'closes_at' => ''/'closes_at' => 'not-a-date'/" api/config.ci.php > /tmp/config.garbage.php
          grep -q "'closes_at' => 'not-a-date'" /tmp/config.garbage.php
          docker run -d --name site-garbage -p 8780:8777 \
            -v /tmp/config.garbage.php:/var/www/html/api/config.php:ro site
          curl -fsS -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused \
            --retry-all-errors http://localhost:8780/
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' -F primary_first_name='Probe' \
            http://localhost:8780/api/apply.php)
          cat /tmp/body.json; echo
          test "$status" = "403"
          test "$(jq -r .error /tmp/body.json)" = "Submissions are now closed."
          # error_log() lands in Apache's error log, which the image sends to
          # stderr. Written to a file first: grep -q under pipefail could
          # SIGPIPE docker logs and fail the step on a match.
          for i in 1 2 3 4 5; do
            docker logs site-garbage > /tmp/garbage.log 2>&1 || true
            grep -q "is not an ISO date with an offset" /tmp/garbage.log && break
            sleep 1
          done
          grep -q "is not an ISO date with an offset" /tmp/garbage.log

      - name: Apply — with no closes_at key the committed default applies
        run: |
          set -euo pipefail
          # The TOP-LEVEL key (4-space indent), not one in the winners block.
          sed "/^    'closes_at' => ''/d" api/config.ci.php > /tmp/config.default.php
          if grep -q "^    'closes_at'" /tmp/config.default.php; then echo "sed did not remove closes_at"; exit 1; fi
          default=$(sed -n "s/^const DEFAULT_CLOSES_AT = '\(.*\)';$/\1/p" api/apply.php)
          test -n "$default"
          # Expected answer from the clock: 422 (past the gate) until
          # DEFAULT_CLOSES_AT + 15 minutes' grace, 403 after.
          if [ "$(date -u +%s)" -lt "$(( $(date -d "$default" +%s) + 15 * 60 ))" ]; then want=422; else want=403; fi
          docker run -d --name site-default -p 8781:8777 \
            -v /tmp/config.default.php:/var/www/html/api/config.php:ro site
          curl -fsS -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused \
            --retry-all-errors http://localhost:8781/
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' -F primary_first_name='Probe' \
            http://localhost:8781/api/apply.php)
          cat /tmp/body.json; echo
          echo "DEFAULT_CLOSES_AT=$default, expected $want"
          test "$status" = "$want"

      - name: Container logs (on failure)
        if: failure()
        run: |
          for c in site site-forced site-email site-closed site-grace site-garbage site-default; do
            echo "===== $c"
            docker logs "$c" || true
          done

  # ------------------------------------------------------------------
  # Winners page (api/winners.php) — its own job, so it can neither disturb
  # nor be disturbed by the application smoke above. Three containers from
  # the same image, each with its own copy of the CI config:
  #   winners-open   :8791  api/config.ci.php as committed (open, archive-only)
  #   winners-closed :8792  closes_at sed'd into the past
  #   winners-email  :8793  delivery_mode sed'd to 'email' — the mode in which
  #                         APPLICATIONS are mailed with attachments; winner
  #                         documents must still never be
  # (Ports 8791-8793 stay clear of the smoke job's 8777-8783, so the two jobs
  # could share a host.) All three mount ci/fake-sendmail.sh, which keeps the
  # last message in /tmp/mail.out and EVERY message in /tmp/mail.all; the
  # steps below read /tmp/mail.all, since the "no message ever carries an
  # attachment" checks have to see the team notice AND the confirmation.
  # ------------------------------------------------------------------
  winners:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build the PHP site image
        run: docker build -f Dockerfile.php -t site .

      - name: Winners — config variants (each sed must match)
        run: |
          set -euo pipefail
          mkdir -p /tmp/wcfg
          cp api/config.ci.php /tmp/wcfg/open.php
          # Exactly one marker line, or the variant would silently be the
          # open config.
          test "$(grep -c 'winners-ci-closes-at' api/config.ci.php)" = "1"
          # The deadline is INSERTED after the marker: the CI winners block
          # has no closes_at key of its own (see the comment in config.ci.php
          # — a second one would be a duplicate key, and the later one wins).
          # 2020-01-01T00:00:00-05:00 = epoch 1577854800
          sed "/winners-ci-closes-at/a\\        'closes_at' => '2020-01-01T00:00:00-05:00'," \
            api/config.ci.php > /tmp/wcfg/closed.php
          test "$(grep -c "'closes_at' => '2020-01-01T00:00:00-05:00'," /tmp/wcfg/closed.php)" = "1"
          grep -A1 'winners-ci-closes-at' /tmp/wcfg/closed.php | grep -q "'closes_at' => '2020-01-01T00:00:00-05:00',"
          sed "s|'delivery_mode' *=> *'off'|'delivery_mode' => 'email'|" api/config.ci.php > /tmp/wcfg/email.php
          grep -q "'delivery_mode' => 'email'" /tmp/wcfg/email.php
          if grep -q "'delivery_mode' *=> *'off'" /tmp/wcfg/email.php; then
            echo "email variant still has delivery_mode 'off'"; exit 1
          fi

      - name: Winners — run the three containers
        run: |
          set -euo pipefail
          sed -i 's/\r$//' ci/fake-sendmail.sh ci/mail-subjects.sh   # guard against a CRLF checkout breaking the shebang
          chmod +x ci/fake-sendmail.sh           # exec bit may not survive a Windows-side commit
          for variant in open:8791 closed:8792 email:8793; do
            name="${variant%%:*}"; port="${variant##*:}"
            docker run -d --name "winners-$name" -p "$port:8777" \
              -v "/tmp/wcfg/$name.php:/var/www/html/api/config.php:ro" \
              -v "$PWD/ci/fake-sendmail.sh:/usr/sbin/sendmail:ro" \
              site
          done
          for port in 8791 8792 8793; do
            curl -fsS -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused \
              --retry-all-errors "http://localhost:$port/"
          done

      - name: Winners — fixtures
        run: |
          set -euo pipefail
          mkdir -p /tmp/wfix
          # Valid documents: content checks are real (getimagesize, %PDF-, a
          # ZIP holding [Content_Types].xml), so these must be the real thing.
          printf '%s\n%s\n' '%PDF-1.4' '%%EOF' > /tmp/wfix/finance-form.pdf
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==' \
            | base64 -d > /tmp/wfix/cheque.png
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/wfix/agreement.docx', 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('[Content_Types].xml',
                         '<?xml version="1.0" encoding="UTF-8"?>'
                         '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
                         '<Default Extension="xml" ContentType="application/xml"/></Types>')
              z.writestr('word/document.xml',
                         '<?xml version="1.0" encoding="UTF-8"?>'
                         '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
                         '<w:body/></w:document>')
          PY
          # Wrong ones
          printf 'GIF89a\001\000\001\000\000\000\000;' > /tmp/wfix/agreement.gif
          cp /tmp/wfix/agreement.docx /tmp/wfix/cheque.docx          # docx: fine for the agreement, not the cheque
          printf '<!DOCTYPE html><html><body><script>alert(1)</script></body></html>\n' > /tmp/wfix/fake.pdf
          printf '\000\000\000\030ftypheic\000\000\000\000mif1heic' > /tmp/wfix/cheque.heic
          { printf '%s\n' '%PDF-1.4'; head -c 11534336 /dev/zero; } > /tmp/wfix/too-big.pdf   # 11 MB
          # Shared by the steps below: a valid set of text fields, and post(),
          # which POSTs to winners.php on <port>, leaves the body in
          # /tmp/body.json (also shown in the log) and prints the HTTP status.
          # University of Regina left the partner list mid-window (4200fd5) but
          # is on the frozen Fall 2026 list, which the server checks.
          cat > /tmp/wfix/common.sh <<'SH'
          FIELDS=(-F school='University of Regina' -F full_name='CI Winner'
                  -F project_title='CI Winning Project' -F email='ci-winner@example.com'
                  -F confirm='I confirm' -F locale=en)
          post() {
            local port=$1; shift
            local code
            code=$(curl -sS -o /tmp/body.json -w '%{http_code}' "$@" "http://localhost:$port/api/winners.php")
            cat /tmp/body.json >&2; echo >&2
            printf '%s' "$code"
          }
          archives() {  # number of winner archives in container $1
            docker exec "$1" sh -c 'find /var/www/_submissions/winners -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l'
          }
          no_attachments() {  # fail if any captured message in container $1 carries one
            docker exec "$1" sh -c 'cat /tmp/mail.all 2>/dev/null || true' > /tmp/mail.captured
            if grep -qi 'Content-Disposition: attachment' /tmp/mail.captured; then
              echo "a captured email in $1 carries an ATTACHMENT"; exit 1
            fi
          }
          SH

      - name: Winners — state check (open) and GET without ?state=1
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' 'http://localhost:8791/api/winners.php?state=1')
          cat /tmp/body.json; echo
          test "$code" = "200"
          test "$(jq -r .state /tmp/body.json)" = "open"
          test "$(jq -r .closes_at_ts /tmp/body.json)" = "null"
          code=$(curl -sS -o /dev/null -w '%{http_code}' 'http://localhost:8791/api/winners.php')
          test "$code" = "405"

      - name: Winners — valid submission is archived (renamed, kind winners), queued, never attached
        run: |
          set -euo pipefail
          source /tmp/wfix/common.sh
          code=$(post 8791 "${FIELDS[@]}" \
            -F file_agreement=@/tmp/wfix/agreement.docx \
            -F file_finance_form=@/tmp/wfix/finance-form.pdf \
            -F file_void_cheque=@/tmp/wfix/cheque.png)
          test "$code" = "200"
          test "$(jq -r .ok /tmp/body.json)" = "true"
          id=$(jq -r .id /tmp/body.json)
          echo "$id" | grep -Eq '^[0-9]{8}-[0-9]{6}-[0-9a-f]{8}$'
          dir="/var/www/_submissions/winners/$id"
          for f in 'Funding agreement - CI Winner.docx' 'Finance form - CI Winner.pdf' 'Void cheque - CI Winner.png'; do
            docker exec winners-open test -f "$dir/$f"
          done
          # One level deeper than applications, so the application retry glob
          # (submissions_dir/*/DELIVERY-PENDING) can never see it.
          docker exec winners-open test ! -e "/var/www/_submissions/$id"
          docker exec winners-open cat "$dir/submission.json" > /tmp/wsub.json
          test "$(jq -r .kind /tmp/wsub.json)" = "winners"
          test "$(jq -r '.documents | length' /tmp/wsub.json)" = "3"
          test "$(jq -r '.files' /tmp/wsub.json)" = "null"          # never the application key
          test "$(jq -r .fields.school /tmp/wsub.json)" = "University of Regina"
          test "$(jq -r .fields.school_listed /tmp/wsub.json)" = "yes"
          test "$(jq -r '.earlier_submissions | length' /tmp/wsub.json)" = "0"
          echo "$id" > /tmp/wfirst.id
          # Delivery runs after the response: wait for the queue marker, then
          # for the winner's confirmation (sent last).
          for i in $(seq 1 20); do docker exec winners-open test -f "$dir/DELIVERY-PENDING" && break; sleep 0.5; done
          docker exec winners-open cat "$dir/DELIVERY-PENDING" > /tmp/wmarker.json
          test "$(jq -r .kind /tmp/wmarker.json)" = "winners"
          test "$(jq -r .mode /tmp/wmarker.json)" = "awaiting-graph"
          for i in $(seq 1 20); do docker exec winners-open grep -q 'To: ci-winner@example.com' /tmp/mail.all && break; sleep 0.5; done
          no_attachments winners-open
          grep -q 'To: ci-winner@example.com' /tmp/mail.captured        # the confirmation
          grep -q 'Hi CI Winner' /tmp/mail.captured
          grep -q 'To: winners-ci@example.invalid' /tmp/mail.captured   # the one team notice
          # Documents stay on the server until SharePoint has them.
          docker exec winners-open test -f "$dir/Void cheque - CI Winner.png"

      - name: Winners — same name again is a SECOND SUBMISSION; school checked on the server; confirmation drops links
        run: |
          set -euo pipefail
          source /tmp/wfix/common.sh
          first=$(cat /tmp/wfirst.id)
          # The same winner's name reordered and re-cased, a different project
          # title (so no folder-name clash), a school posted directly that is
          # not on the frozen list, and a title carrying a link — the kind of
          # text that would turn the confirmation into someone else's message.
          code=$(post 8791 -F school='Anything At All' -F full_name='Winner,  ci' \
            -F project_title='Claim your prize at https://evil.example/x' -F email='ci-relay@example.com' \
            -F confirm='I confirm' -F locale=en \
            -F file_agreement=@/tmp/wfix/agreement.docx \
            -F file_finance_form=@/tmp/wfix/finance-form.pdf \
            -F file_void_cheque=@/tmp/wfix/cheque.png)
          test "$code" = "200"
          id=$(jq -r .id /tmp/body.json)
          docker exec winners-open cat "/var/www/_submissions/winners/$id/submission.json" > /tmp/wsub2.json
          test "$(jq -r .fields.school_listed /tmp/wsub2.json)" = "no"
          test "$(jq -r '.earlier_submissions | length' /tmp/wsub2.json)" = "1"
          test "$(jq -r '.earlier_submissions[0].id' /tmp/wsub2.json)" = "$first"
          for i in $(seq 1 20); do docker exec winners-open grep -q 'To: ci-relay@example.com' /tmp/mail.all && break; sleep 0.5; done
          no_attachments winners-open
          # The team notice leads with the warning and names the first one.
          grep -q 'SECOND SUBMISSION for this name' /tmp/mail.captured
          grep -q "  $first  CI Winner <ci-winner@example.com>" /tmp/mail.captured
          grep -q 'School:        Anything At All   (NOT on the Fall 2026 list)' /tmp/mail.captured
          # The confirmation (messages start at their "To:" line): generic
          # wording for the title, and no trace of the link.
          awk '/^To: /{keep = /ci-relay@example\.com/} keep' /tmp/mail.captured > /tmp/wack.txt
          grep -q 'Hi Winner, ci,' /tmp/wack.txt
          grep -q 'We received your documents for your project:' /tmp/wack.txt
          if grep -qi 'evil' /tmp/wack.txt; then echo "the confirmation carries the link"; exit 1; fi

      # ---- [TEST] marking on the winners page: sent as a test copy of the
      # site (curl -H 'Host: staging.alumoimpact.ca', as in the application
      # smoke), every winners subject starts "[TEST] " and submission.json says
      # "test": true; localhost stays unmarked. CI has no SharePoint, so the
      # team email here is the failure notice (the php CLI step below checks
      # the TEST / <root_folder> / … folder path, and sends the "received" and
      # "filed after retry" notices directly to check their subjects).
      - name: Winners — sent as staging, every subject says [TEST]; test and real never count as each other's second submission
        run: |
          set -euo pipefail
          source /tmp/wfix/common.sh
          first=$(cat /tmp/wfirst.id)
          # subjects <container>: the decoded Subject: of every message it has
          # captured so far, one per line.
          subjects() {
            docker exec "$1" sh -c 'cat /tmp/mail.all 2>/dev/null || true' > /tmp/mail.captured
            sh ci/mail-subjects.sh /tmp/mail.captured
          }
          # wait_mail <container> <n>: until it has captured n messages. Each
          # submission sends two after its response (the team email, then the
          # confirmation), so each request waits for its pair.
          wait_mail() {
            for i in $(seq 1 30); do
              [ "$(subjects "$1" | wc -l)" -ge "$2" ] && return 0
              sleep 0.5
            done
            echo "expected $2 messages in $1"; subjects "$1"; return 1
          }
          docs=(-F file_agreement=@/tmp/wfix/agreement.docx
                -F file_finance_form=@/tmp/wfix/finance-form.pdf
                -F file_void_cheque=@/tmp/wfix/cheque.png)
          # Only localhost has posted so far: nothing is marked.
          subjects winners-open > /tmp/wsubj.txt
          cat /tmp/wsubj.txt
          if grep -q '\[TEST\]' /tmp/wsubj.txt; then echo "a localhost subject says [TEST]"; exit 1; fi
          n=$(wc -l < /tmp/wsubj.txt)

          # 1. The first real winner's own name and title, sent as staging: a
          #    test submission, and NOT a second submission of the real one.
          code=$(post 8791 -H 'Host: staging.alumoimpact.ca' "${FIELDS[@]}" "${docs[@]}")
          test "$code" = "200"
          t1=$(jq -r .id /tmp/body.json)
          docker exec winners-open cat "/var/www/_submissions/winners/$t1/submission.json" > /tmp/wsubt.json
          test "$(jq -r .test /tmp/wsubt.json)" = "true"
          test "$(jq -r '.earlier_submissions | length' /tmp/wsubt.json)" = "0"
          wait_mail winners-open $((n + 2))
          subjects winners-open | tail -n 2 > /tmp/wsubj.txt
          cat /tmp/wsubj.txt
          test "$(sed -n 1p /tmp/wsubj.txt)" = "[TEST] Winner documents NOT yet filed — will retry ($t1)"
          test "$(sed -n 2p /tmp/wsubj.txt)" = "[TEST] We received your documents — Student Impact Fund"

          # 2. The same name again (reordered), in French, as staging: a
          #    second submission of the TEST one only.
          code=$(post 8791 -H 'Host: staging.alumoimpact.ca' -F school='University of Regina' \
            -F full_name='Winner, CI' -F project_title='CI Test Project' -F email='ci-test@example.com' \
            -F confirm='I confirm' -F locale=fr "${docs[@]}")
          test "$code" = "200"
          t2=$(jq -r .id /tmp/body.json)
          docker exec winners-open cat "/var/www/_submissions/winners/$t2/submission.json" > /tmp/wsubt.json
          test "$(jq -r .test /tmp/wsubt.json)" = "true"
          test "$(jq -r '[.earlier_submissions[].id] | join(" ")' /tmp/wsubt.json)" = "$t1"
          wait_mail winners-open $((n + 4))
          subjects winners-open | tail -n 2 > /tmp/wsubj.txt
          cat /tmp/wsubj.txt
          test "$(sed -n 1p /tmp/wsubj.txt)" = "[TEST] SECOND SUBMISSION — Winner documents NOT yet filed — will retry ($t2)"
          test "$(sed -n 2p /tmp/wsubj.txt)" = "[TEST] Nous avons bien reçu vos documents — Fonds d'impact étudiant"

          # 3. The same name from localhost once more: unmarked, and its
          #    earlier submissions are the two real ones — neither test id.
          code=$(post 8791 "${FIELDS[@]}" "${docs[@]}")
          test "$code" = "200"
          r3=$(jq -r .id /tmp/body.json)
          docker exec winners-open cat "/var/www/_submissions/winners/$r3/submission.json" > /tmp/wsubr.json
          test "$(jq -r .test /tmp/wsubr.json)" = "false"
          jq -r '.earlier_submissions[].id' /tmp/wsubr.json > /tmp/wearlier.txt
          cat /tmp/wearlier.txt
          grep -qx "$first" /tmp/wearlier.txt
          test "$(wc -l < /tmp/wearlier.txt)" = "2"   # the first and second real submissions
          if grep -qx -e "$t1" -e "$t2" /tmp/wearlier.txt; then echo "a real submission counted a test one"; exit 1; fi
          wait_mail winners-open $((n + 6))
          subjects winners-open | tail -n 2 > /tmp/wsubj.txt
          cat /tmp/wsubj.txt
          test "$(sed -n 1p /tmp/wsubj.txt)" = "SECOND SUBMISSION — Winner documents NOT yet filed — will retry ($r3)"
          test "$(sed -n 2p /tmp/wsubj.txt)" = "We received your documents — Student Impact Fund"
          no_attachments winners-open

      - name: Winners — missing file and field errors are 422 and store nothing
        run: |
          set -euo pipefail
          source /tmp/wfix/common.sh
          before=$(archives winners-open)
          code=$(post 8791 "${FIELDS[@]}" \
            -F file_agreement=@/tmp/wfix/agreement.docx \
            -F file_finance_form=@/tmp/wfix/finance-form.pdf)
          test "$code" = "422"
          test "$(jq -r .error /tmp/body.json)" = "fields"
          test "$(jq -r .fields.file_void_cheque /tmp/body.json)" = "required"
          # "not listed" needs its name box; email must be an email
          code=$(post 8791 -F school='__other' -F full_name='CI Winner' -F project_title='P' \
            -F email='not-an-email' -F confirm='I confirm' \
            -F file_agreement=@/tmp/wfix/agreement.docx \
            -F file_finance_form=@/tmp/wfix/finance-form.pdf \
            -F file_void_cheque=@/tmp/wfix/cheque.png)
          test "$code" = "422"
          test "$(jq -r .fields.school_other /tmp/body.json)" = "required"
          test "$(jq -r .fields.email /tmp/body.json)" = "invalid_email"
          test "$(archives winners-open)" = "$before"

      - name: Winners — wrong types (by name and by content) are 422
        run: |
          set -euo pipefail
          source /tmp/wfix/common.sh
          before=$(archives winners-open)
          code=$(post 8791 "${FIELDS[@]}" \
            -F file_agreement=@/tmp/wfix/agreement.gif \
            -F file_finance_form=@/tmp/wfix/fake.pdf \
            -F file_void_cheque=@/tmp/wfix/cheque.docx)
          test "$code" = "422"
          test "$(jq -r .fields.file_agreement /tmp/body.json)" = "file_type"      # .gif
          test "$(jq -r .fields.file_finance_form /tmp/body.json)" = "file_type"   # HTML named .pdf
          test "$(jq -r .fields.file_void_cheque /tmp/body.json)" = "file_type"    # docx: not for the cheque
          test "$(archives winners-open)" = "$before"

      - name: Winners — HEIC gets its own error
        run: |
          set -euo pipefail
          source /tmp/wfix/common.sh
          code=$(post 8791 "${FIELDS[@]}" \
            -F file_agreement=@/tmp/wfix/agreement.docx \
            -F file_finance_form=@/tmp/wfix/finance-form.pdf \
            -F file_void_cheque=@/tmp/wfix/cheque.heic)
          test "$code" = "422"
          test "$(jq -r .fields.file_void_cheque /tmp/body.json)" = "file_heic"

      - name: Winners — 11 MB file is rejected
        run: |
          set -euo pipefail
          source /tmp/wfix/common.sh
          # As in the application test: the image's PHP limits sit above 11 MB,
          # so winners.php's own 10 MB check answers 422; 413 is also a correct
          # rejection if post_max_size ever trips first.
          code=$(post 8791 "${FIELDS[@]}" \
            -F file_agreement=@/tmp/wfix/agreement.docx \
            -F file_finance_form=@/tmp/wfix/too-big.pdf \
            -F file_void_cheque=@/tmp/wfix/cheque.png)
          case "$code" in
            422) test "$(jq -r .fields.file_finance_form /tmp/body.json)" = "file_size" ;;
            413) ;;
            *)   echo "unexpected status: $code"; exit 1 ;;
          esac

      - name: Winners — honeypot pretends success but archives nothing
        run: |
          set -euo pipefail
          source /tmp/wfix/common.sh
          before=$(archives winners-open)
          code=$(post 8791 -F website='https://spam.example.com' -F full_name='Bot')
          test "$code" = "200"
          test "$(jq -r .ok /tmp/body.json)" = "true"
          test "$(jq -r .id /tmp/body.json)" = "null"
          test "$(archives winners-open)" = "$before"

      - name: Winners — after the deadline the page says closed and submissions get 403
        run: |
          set -euo pipefail
          source /tmp/wfix/common.sh
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' 'http://localhost:8792/api/winners.php?state=1')
          cat /tmp/body.json; echo
          test "$code" = "200"
          test "$(jq -r .state /tmp/body.json)" = "closed"
          test "$(jq -r .closes_at_ts /tmp/body.json)" = "1577854800"
          code=$(post 8792 "${FIELDS[@]}" \
            -F file_agreement=@/tmp/wfix/agreement.docx \
            -F file_finance_form=@/tmp/wfix/finance-form.pdf \
            -F file_void_cheque=@/tmp/wfix/cheque.png)
          test "$code" = "403"
          test "$(jq -r .error /tmp/body.json)" = "closed"
          test "$(jq -r .closes_at_ts /tmp/body.json)" = "1577854800"
          test "$(archives winners-closed)" = "0"

      - name: Winners — email delivery mode still never attaches; redeliver leaves it pending
        run: |
          set -euo pipefail
          source /tmp/wfix/common.sh
          code=$(post 8793 -F school='__other' -F school_other='École CI' -F full_name='CI Gagnante' \
            -F project_title='Projet CI' -F email='ci-gagnante@example.com' -F confirm='I confirm' -F locale=fr \
            -F file_agreement=@/tmp/wfix/agreement.docx \
            -F file_finance_form=@/tmp/wfix/finance-form.pdf \
            -F file_void_cheque=@/tmp/wfix/cheque.png)
          test "$code" = "200"
          id=$(jq -r .id /tmp/body.json)
          dir="/var/www/_submissions/winners/$id"
          for i in $(seq 1 20); do docker exec winners-email grep -q 'To: ci-gagnante@example.com' /tmp/mail.all && break; sleep 0.5; done
          no_attachments winners-email
          grep -q 'To: ci-gagnante@example.com' /tmp/mail.captured
          grep -q 'Bonjour CI Gagnante' /tmp/mail.captured                # French confirmation
          docker exec winners-email cat "$dir/submission.json" > /tmp/wsub.json
          test "$(jq -r .fields.school /tmp/wsub.json)" = "École CI"
          test "$(jq -r .fields.school_listed /tmp/wsub.json)" = "no"
          # The retry job must leave a winner archive pending in email mode —
          # never mail it the way it mails applications.
          docker exec winners-email php /var/www/html/api/redeliver.php | tee /tmp/redeliver.out
          grep -q "winners/$id: left pending — winner documents go to SharePoint only (delivery_mode is 'email')" /tmp/redeliver.out
          no_attachments winners-email
          docker exec winners-email test -f "$dir/DELIVERY-PENDING"
          for f in 'Funding agreement - CI Gagnante.docx' 'Finance form - CI Gagnante.pdf' 'Void cheque - CI Gagnante.png'; do
            docker exec winners-email test -f "$dir/$f"
          done

      - name: Winners — config rules and helpers (php CLI)
        run: |
          set -euo pipefail
          docker exec -i winners-open php <<'PHP'
          <?php
          require '/var/www/html/api/_lib.php';
          $base = require '/var/www/html/api/config.php';
          $failed = false;
          $expect = function ($label, $ok) use (&$failed) {
              echo ($ok ? 'ok    ' : 'FAIL  ') . $label . "\n";
              if (!$ok) $failed = true;
          };
          // A deadline is set in these two so it is the Graph rule that closes them.
          $c = $base; unset($c['winners']['allow_without_graph']); $c['winners']['closes_at'] = '2099-01-01T00:00:00-05:00';
          $expect('no Graph, no allow_without_graph -> closed', winners_config($c) === null);
          $c = $base; $c['winners']['allow_without_graph'] = 1; $c['winners']['closes_at'] = '2099-01-01T00:00:00-05:00';
          $expect('allow_without_graph must be exactly true', winners_config($c) === null);
          $c = $base; $c['winners']['closes_at'] = '2026-10-30 23:59';
          $expect('date without an offset -> closed', winners_config($c) === null);
          $c = $base; $c['winners']['closes_at'] = '2026-10-30T23:59:59';
          $expect('ISO date without an offset -> closed', winners_config($c) === null);
          $c = $base; $c['winners']['closes_at'] = 'next friday';
          $expect('unparseable date -> closed', winners_config($c) === null);
          $c = $base; $c['winners']['opens_at'] = '2026-11-01T00:00:00-04:00'; $c['winners']['closes_at'] = '2026-10-01T00:00:00-04:00';
          $expect('opens_at after closes_at -> closed', winners_config($c) === null);
          foreach (['2026-11-31T23:59:59-05:00', '2026-02-29T12:00:00-05:00', '2026-10-30T24:00:00-04:00',
                    '2026-10-30T23:60:00-04:00', '2026-10-30T23:59:59-24:00'] as $bad) {
              $c = $base; $c['winners']['closes_at'] = $bad;
              $expect("impossible date $bad -> closed (never rolled forward)", winners_config($c) === null);
          }
          $c = $base; $c['winners']['closes_at'] = '2026-10-31T03:59:59Z';
          $expect('Z offset is read as UTC', winners_config($c)['closes_at_ts'] === strtotime('2026-10-30T23:59:59-04:00'));
          $c = $base; $c['winners']['round'] = '';
          $expect('empty round -> closed', winners_config($c) === null);
          $c = $base; unset($c['winners']['allow_without_graph']); $c['delivery_mode'] = 'graph';
          $c['graph'] = ['tenant_id' => 't', 'client_id' => 'c', 'client_secret' => 's', 'drive_id' => 'apps-drive'];
          $expect('graph mode, no closes_at key -> closed', winners_config($c) === null);
          $c['winners']['closes_at'] = '';
          $expect("graph mode, closes_at '' -> closed", winners_config($c) === null);
          $c['winners']['closes_at'] = 'none';
          $w = winners_config($c);
          $expect("closes_at 'none' -> open with no deadline", is_array($w) && $w['closes_at_ts'] === null);
          $c['winners']['closes_at'] = '2099-01-01T00:00:00-05:00';
          $w = winners_config($c);
          $expect('graph mode with credentials -> open', is_array($w) && $w['graph_ready'] === true
              && $w['drive_id'] === 'apps-drive' && $w['create_root'] === false);
          $c['winners']['drive_id'] = 'winners-drive';
          $expect('winners.drive_id beats graph.drive_id', winners_config($c)['drive_id'] === 'winners-drive');
          $c['graph']['client_secret'] = '';
          $expect('graph mode without a secret -> closed', winners_config($c) === null);
          $w = winners_config($base);
          $w['opens_at_ts'] = 500; $w['closes_at_ts'] = 1000; $w['close_grace_minutes'] = 15;
          $expect('not-open before opens_at', winners_window_state($w, 499, false) === 'not-open');
          $expect('open inside the window', winners_window_state($w, 999, false) === 'open');
          $expect('page closed from closes_at exactly', winners_window_state($w, 1000, false) === 'closed');
          $expect('submissions open inside the grace', winners_window_state($w, 1000 + 14 * 60, true) === 'open');
          $expect('submissions closed after the grace', winners_window_state($w, 1000 + 15 * 60, true) === 'closed');
          $expect('doc name keeps its extension when long',
              winners_doc_name('Void cheque', str_repeat('A', 150), 'jpg') === 'Void cheque - ' . str_repeat('A', 86) . '.jpg');
          $expect('doc name loses path characters', winners_doc_name('Finance form', 'a/b:c', 'pdf') === 'Finance form - a-b-c.pdf');
          $k = winners_name_keys('Jane Doe');
          foreach (['jane  doe.', 'Doe, Jane', 'Jané Doe', "J\u{0430}ne Doe", 'JaneDoe'] as $variant) {
              $expect("same name: '$variant'", (bool)array_intersect($k, winners_name_keys($variant)));
          }
          $expect('different name', !array_intersect($k, winners_name_keys('Jane Dow')));
          $expect('confirmation keeps a plain name', winners_ack_value(' Jane   Doe ', 60) === 'Jane Doe');
          $expect('confirmation drops a link', winners_ack_value('Prize at https://x.example/a', 80) === '');
          $expect('confirmation drops a bare domain', winners_ack_value('see evil.example now', 80) === '');
          $expect('confirmation drops an address', winners_ack_value('write me@x', 80) === '');
          $expect('confirmation drops a long value', winners_ack_value(str_repeat('a', 61), 60) === '');
          $list = '/var/www/html/js/winners-schools-fall-2026.js';
          $expect('school on the frozen list (any case)', winners_school_listed($list, 'university of regina') === true);
          $expect('school not on the list', winners_school_listed($list, 'Anything At All') === false);
          $expect('unreadable list -> unchecked', winners_school_listed('/nonexistent.js', 'x') === null);
          // [TEST] marking reads the ARCHIVED flag (a retry has no host).
          $expect('record without test -> real', winners_is_test(['id' => 'x']) === false);
          $expect("record with test 'yes' -> real (true only)", winners_is_test(['test' => 'yes']) === false);
          $expect('record with test true -> test', winners_is_test(['test' => true]) === true);
          $rec = ['root_folder' => 'Winners', 'round' => 'Fall 2026', 'fields' => ['full_name' => 'Jane Doe', 'project_title' => 'P']];
          $expect('real folder: Winners / round / leaf, root at 0',
              winners_folder_segments($rec) === [['Winners', 'Fall 2026', 'Jane Doe - P'], 0]);
          $rec['test'] = true;
          $expect('test folder: TEST / Winners / round / leaf, root at 1',
              winners_folder_segments($rec) === [['TEST', 'Winners', 'Fall 2026', 'Jane Doe - P'], 1]);
          // The "filed" notices: CI has no SharePoint, so no request sends them.
          // mail() goes to ci/fake-sendmail.sh, which leaves the message in /tmp/mail.out.
          $notice = function (bool $test, bool $afterRetry) use ($base): string {
              file_put_contents('/tmp/mail.out', '');
              winners_notify_delivered($base, ['id' => 'x', 'round' => 'R', 'test' => $test,
                  'fields' => ['full_name' => 'Jane Doe']], ['path' => 'W/R/Jane Doe - P'], $afterRetry, true);
              $m = (string)file_get_contents('/tmp/mail.out');
              return preg_match('/^Subject: =\?UTF-8\?B\?(.*)\?=\r?$/m', $m, $s) === 1 ? (string)base64_decode($s[1]) : '';
          };
          $expect('test record: received notice says [TEST]',
              $notice(true, false) === '[TEST] Winner documents received — Jane Doe (R)');
          $expect('test record: filed-after-retry notice says [TEST]',
              $notice(true, true) === '[TEST] Winner documents filed after retry — Jane Doe (R)');
          $expect('real record: filed-after-retry notice unmarked',
              $notice(false, true) === 'Winner documents filed after retry — Jane Doe (R)');
          $tmp = sys_get_temp_dir() . '/winners-sep-' . getmypid();
          foreach (['real-a' => false, 'test-b' => true] as $sid => $t) {
              @mkdir("$tmp/$sid", 0700, true);
              file_put_contents("$tmp/$sid/submission.json", json_encode(['id' => $sid, 'kind' => 'winners',
                  'round' => 'R', 'test' => $t, 'fields' => ['full_name' => 'Jane Doe']]));
          }
          $ids = fn(array $e): array => array_column($e, 'id');
          $expect('real submission: earlier = real ones only',
              $ids(winners_earlier_submissions($tmp, 'R', 'Doe, Jane', 'new', false)) === ['real-a']);
          $expect('test submission: earlier = test ones only',
              $ids(winners_earlier_submissions($tmp, 'R', 'Doe, Jane', 'new', true)) === ['test-b']);
          exit($failed ? 1 : 0);
          PHP

      - name: Winners — container logs, archives and mail (on failure)
        if: failure()
        run: |
          for c in winners-open winners-closed winners-email; do
            echo "=================== $c: docker logs"
            docker logs "$c" || true
            echo "=================== $c: archives"
            docker exec "$c" sh -c 'find /var/www/_submissions -maxdepth 3 | sort;
              for f in /var/www/_submissions/winners/*/submission.json /var/www/_submissions/winners/*/DELIVERY-PENDING; do
                [ -f "$f" ] && { echo "--- $f"; cat "$f"; echo; }
              done' || true
            echo "=================== $c: captured mail"
            docker exec "$c" cat /tmp/mail.all || true
          done
