---
# cPanel Git Version Control deployment (GoDaddy shared hosting).
#
# The repo is cloned into ~/repos/impactfund on the server; hitting "Deploy
# HEAD Commit" in cPanel (or `git push` + deploy) syncs the SITE FILES ONLY
# into the target document root below.
#
# DEPLOYPATH is the STAGING docroot while we test. To go live, change it to
# the production docroot (/home/aseqhosting/public_html) — that is the single
# switch that makes this the real site, so change it deliberately.
#
# Build-time and private files never ship: _source/, _proposal/ and
# api/config.php are git-ignored (never in the repo at all); _tools/, ci/,
# .github/, the Docker files and the *.md docs are excluded here.
deployment:
  tasks:
    # PRODUCTION docroot. public_html is SHARED with other sites on this
    # account (_continuumplan.com, _plancontinuum.com, _skybleu.com, _video,
    # Assets, alumoimpact.ca, cgi-bin) — so NEVER use --delete here: it would
    # erase them. Without --delete, rsync only adds/updates our own files.
    - export DEPLOYPATH=/home/aseqhosting/public_html
    - >
      /usr/bin/rsync -a
      --exclude='.git'
      --exclude='.github'
      --exclude='.cpanel.yml'
      --exclude='.gitignore'
      --exclude='.dockerignore'
      --exclude='_tools'
      --exclude='_source'
      --exclude='_proposal'
      --exclude='_submissions'
      --exclude='submissions'
      --exclude='ci'
      --exclude='Dockerfile*'
      --exclude='docker-compose.yml'
      --exclude='nginx.conf'
      --exclude='msmtprc*'
      --exclude='*.md'
      ./ $DEPLOYPATH/
    # MUST run AFTER rsync: `rsync -a` stamps the source directory's own
    # permissions (the git clone is 0700) onto the destination, which makes
    # Apache answer 403. 0750 is this host's standard for public_html.
    - /bin/chmod 750 $DEPLOYPATH
    # NOTE: public_html/.htaccess is deliberately NOT managed here. It is
    # shared infrastructure affecting the other sites on this account, so it
    # is maintained by hand rather than rewritten on every deploy.
