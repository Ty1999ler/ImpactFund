---
# cPanel Git Version Control deployment.
#
#   branch `release`  ->  PRODUCTION   alumoimpact.ca      (public_html)
#   branch `main`     ->  STAGING      staging.alumoimpact.ca (~/staging)
#
# Two clones exist on the server, each checked out on one of those branches;
# this single file serves both and picks its target from the current branch.
# Workflow: land changes on `main`, check staging, then merge main -> release
# to publish.
deployment:
  tasks:
    # Default to STAGING. Production is opt-in via the branch name, so any
    # failure of the check below lands on staging rather than the live site.
    - export DEPLOYPATH=/home/aseqhosting/staging
    - export RSYNC_DELETE=--delete
    - export IS_PROD=no
    - if [ "$(/usr/bin/git rev-parse --abbrev-ref HEAD)" = "release" ]; then export DEPLOYPATH=/home/aseqhosting/public_html; export IS_PROD=yes; fi
    # public_html is SHARED with other sites on this account (_continuumplan.com,
    # _plancontinuum.com, _skybleu.com, _video, Assets, cgi-bin). --delete there
    # would erase them, so it is only ever used on the staging docroot.
    - if [ "$IS_PROD" = "yes" ]; then export RSYNC_DELETE=; fi
    # Hard guard: never rsync into an empty or missing path.
    - test -n "$DEPLOYPATH" || exit 1
    - /bin/mkdir -p $DEPLOYPATH
    - >
      /usr/bin/rsync -a $RSYNC_DELETE
      --exclude='.git'
      --exclude='.github'
      --exclude='.cpanel.yml'
      --exclude='.gitignore'
      --exclude='.dockerignore'
      --exclude='_tools'
      --exclude='_source'
      --exclude='_proposal'
      --exclude='_submissions'
      --exclude='submissions'
      --exclude='ci'
      --exclude='_deploy'
      --exclude='api/config.ci.php'
      --exclude='api/config.example.php'
      --exclude='Dockerfile*'
      --exclude='docker-compose.yml'
      --exclude='nginx.conf'
      --exclude='msmtprc*'
      --exclude='*.md'
      ./ $DEPLOYPATH/
    # MUST run AFTER rsync: `rsync -a` stamps the source directory's permissions
    # (the git clone is 0700) onto the destination. 0755, NOT 0750 - Apache
    # serves static files as a user outside this account's group, so without the
    # world-execute bit every site under public_html returns 403/500.
    - /bin/chmod 755 $DEPLOYPATH
    # Staging must never be indexed; production keeps the repo's own robots.txt.
    # The content is copied from a file rather than echoed inline because a
    # colon-space inside an unquoted YAML task silently breaks this whole file
    # (the deploy then runs and writes an empty log — that bug cost us an hour).
    - if [ "$IS_PROD" != "yes" ]; then /bin/cp _deploy/robots-staging.txt $DEPLOYPATH/robots.txt; fi
    # NOTE: public_html/.htaccess is deliberately NOT managed here - it is shared
    # infrastructure affecting the other sites, maintained by hand.
