---
# cPanel Git Version Control deployment (GoDaddy shared hosting).
#
# The repo is cloned into ~/repos/impactfund on the server; hitting "Deploy
# HEAD Commit" in cPanel (or `git push` + deploy) syncs the SITE FILES ONLY
# into the target document root below.
#
# DEPLOYPATH is the STAGING docroot while we test. To go live, change it to
# the production docroot (/home/aseqhosting/public_html) — that is the single
# switch that makes this the real site, so change it deliberately.
#
# Build-time and private files never ship: _source/, _proposal/ and
# api/config.php are git-ignored (never in the repo at all); _tools/, ci/,
# .github/, the Docker files and the *.md docs are excluded here.
deployment:
  tasks:
    # Staging docroot lives OUTSIDE public_html on purpose: a "Deny from all"
    # in public_html/.htaccess (added by the host/owner) blocks everything
    # beneath it. Home (/home/aseqhosting) is 0711, so Apache can still
    # traverse into this directory.
    - export DEPLOYPATH=/home/aseqhosting/staging
    - /bin/mkdir -p $DEPLOYPATH
    - >
      /usr/bin/rsync -a --delete
      --exclude='.git'
      --exclude='.github'
      --exclude='.cpanel.yml'
      --exclude='_tools'
      --exclude='_source'
      --exclude='_proposal'
      --exclude='_submissions'
      --exclude='submissions'
      --exclude='ci'
      --exclude='Dockerfile*'
      --exclude='docker-compose.yml'
      --exclude='nginx.conf'
      --exclude='msmtprc'
      --exclude='*.md'
      ./ $DEPLOYPATH/
    # MUST run AFTER rsync: `rsync -a` copies the source directory's own
    # permissions onto the destination, and the git clone is 0700 — which
    # makes Apache answer 403. Re-open the docroot every deploy.
    - /bin/chmod 755 $DEPLOYPATH
    # Staging must never be indexed. Written by the deploy, not stored in the
    # repo, so production never inherits it.
    - /bin/echo 'User-agent: *' > $DEPLOYPATH/robots.txt
    - /bin/echo 'Disallow: /' >> $DEPLOYPATH/robots.txt
