---
# cPanel Git Version Control deployment.
#
#   branch `release`  ->  PRODUCTION   alumoimpact.ca      (public_html)
#   branch `main`     ->  STAGING      staging.alumoimpact.ca (~/staging)
#
# Two clones exist on the server, each checked out on one of those branches;
# this single file serves both and picks its target from the current branch.
# Workflow: land changes on `main`, check staging, then merge main -> release
# to publish.
deployment:
  tasks:
    # Default to STAGING. Production is opt-in via the branch name, so any
    # failure of the check below lands on staging rather than the live site.
    # Paths are $HOME-based (2026-08-28): the account was reprovisioned onto a
    # new server with a new username, and hardcoded /home/<user> paths broke.
    - export DEPLOYPATH=$HOME/staging
    - export RSYNC_DELETE=--delete
    - export IS_PROD=no
    - export IS_SEPT=no
    - export BRANCH=$(/usr/bin/git rev-parse --abbrev-ref HEAD)
    - if [ "$BRANCH" = "release" ]; then export DEPLOYPATH=$HOME/public_html; export IS_PROD=yes; fi
    # september-preview: identical content to main, but the deployed copy has
    # the submissions-open date rolled back so the site renders exactly as it
    # will on Sept 1. Keeping the branch content identical means it never
    # conflicts when main moves forward.
    - if [ "$BRANCH" = "september-preview" ]; then export DEPLOYPATH=$HOME/september; export IS_SEPT=yes; fi
    # public_html may hold other sites' docroots (it did on the old account:
    # the Continuum sites). --delete is never used there, only on the
    # staging docroot.
    - if [ "$IS_PROD" = "yes" ]; then export RSYNC_DELETE=; fi
    # Hard guard: never rsync into an empty or missing path.
    - test -n "$DEPLOYPATH" || exit 1
    - /bin/mkdir -p $DEPLOYPATH
    # api/config.php and api/.htaccess exist ONLY on the server (credentials /
    # hardening, never in this public repo). Excluding them here stops the
    # --delete used on staging/september from wiping them on every deploy —
    # which happened on 2026-08-27 and silently broke the september form (503).
    - >
      /usr/bin/rsync -a $RSYNC_DELETE
      --exclude='.git'
      --exclude='api/config.php'
      --exclude='api/.htaccess'
      --exclude='/.htaccess'
      --exclude='.github'
      --exclude='.cpanel.yml'
      --exclude='.gitignore'
      --exclude='.dockerignore'
      --exclude='_tools'
      --exclude='_source'
      --exclude='_proposal'
      --exclude='_submissions'
      --exclude='submissions'
      --exclude='ci'
      --exclude='_deploy'
      --exclude='api/config.ci.php'
      --exclude='api/config.example.php'
      --exclude='Dockerfile*'
      --exclude='docker-compose.yml'
      --exclude='nginx.conf'
      --exclude='msmtprc*'
      --exclude='*.md'
      ./ $DEPLOYPATH/
    # MUST run AFTER rsync: `rsync -a` stamps the source directory's permissions
    # (the git clone is 0700) onto the destination. 0755, NOT 0750 - Apache
    # serves static files as a user outside this account's group, so without the
    # world-execute bit every site under public_html returns 403/500.
    - /bin/chmod 755 $DEPLOYPATH
    # september-preview only: roll the reveal date back in the DEPLOYED copy so
    # the application form, the Apply Now nav item and anything else gated on
    # data-opens-at render as they will once submissions open. The repo itself
    # is never modified.
    - if [ "$IS_SEPT" = "yes" ]; then /usr/bin/find $DEPLOYPATH -name '*.html' -exec /bin/sed -i 's/2026-09-01T00/2020-01-01T00/g' {} + ; fi
    # Staging must never be indexed; production keeps the repo's own robots.txt.
    # The content is copied from a file rather than echoed inline because a
    # colon-space inside an unquoted YAML task silently breaks this whole file
    # (the deploy then runs and writes an empty log — that bug cost us an hour).
    - if [ "$IS_PROD" != "yes" ]; then /bin/cp _deploy/robots-staging.txt $DEPLOYPATH/robots.txt; fi
    # NOTE: public_html/.htaccess is deliberately NOT managed here - it is shared
    # infrastructure affecting the other sites, maintained by hand.
