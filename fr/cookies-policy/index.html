<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <title>Politique de témoins</title>
  <!-- Témoins are covered inside Alumo's own Privacy Statement rather than a
       separate page — that is how alumo.ca does it, and alumo.ca has no
       standalone cookie policy (checked 2026-08-31: /cookie-policy/,
       /cookies/, /cookie-statement/ all 404).
       This URL therefore forwards there rather than to the home page.
       NOTE for whoever picks this up: that statement mentions cookies only in
       passing and does not name Google Analytics. Raised with Alumo. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="/fr/privacy-policy/">
  <meta http-equiv="refresh" content="0; url=/fr/privacy-policy/">
  <script>window.location.replace("/fr/privacy-policy/");</script>
</head>
<body>
  <p><a href="/fr/privacy-policy/">Continuer vers l'Énoncé de confidentialité d'Alumo</a></p>
</body>
</html>
