<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <title>Comment soumettre un projet</title>
  <!-- Two moves, one destination. The French pages moved to French URLs on
       2026-08-28 (/fr/how-to-apply/ -> /fr/comment-soumettre/), then Comment
       soumettre merged into Soumettre on 2026-09-01. This stub points straight
       at the final destination rather than hopping through the intermediate
       slug — a redirect to a redirect is slower, search engines discount it,
       and some clients refuse to follow the second hop. fr/.htaccess does the
       same and issues a real 301 before Apache reaches this file, so this is a
       fallback, not the primary redirect. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://alumoimpact.ca/fr/soumettre/">
  <meta http-equiv="refresh" content="0; url=/fr/soumettre/">
  <script>window.location.replace("/fr/soumettre/");</script>
</head>
<body>
  <p><a href="/fr/soumettre/">Comment soumettre un projet</a></p>
</body>
</html>
