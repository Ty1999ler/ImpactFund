server {
    listen 8777;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Pretty URLs: /about-the-fund/ -> about-the-fund/index.html
    location / {
        try_files $uri $uri/ =404;
        # HTML always revalidates so content updates show immediately
        add_header Cache-Control "no-cache";
    }

    # Fingerprint-free static assets: cache for a week
    location ~* \.(css|js|png|jpe?g|svg|webp|woff2?|pdf|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
